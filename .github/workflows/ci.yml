name: CI

# The hub's gate on CI: nu-check every script, lib core and nushell-fp module,
# then run the pure suites (hub tests/lib + nushell-fp/tests). The
# tests/scripts layer is machine-only (symlinks, config.nu) and is skipped
# with --ci. Nushell is PINNED STABLE (0.117.0, the fleet's version):
# nightly tags rotate — the kap Claims lesson (22/11).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  laws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Nushell (stable 0.117.0) + bat
        run: |
          curl -fsSL -o nu.tar.gz 'https://github.com/nushell/nushell/releases/download/0.117.0/nu-0.117.0-x86_64-unknown-linux-gnu.tar.gz'
          tar -xzf nu.tar.gz
          sudo mv nu-0.117.0-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu
          nu --version
          # the hl mod's off-Nushell leg gates on bat (a real dependency of
          # the highlight tests); ubuntu's package names the binary batcat
          sudo apt-get update
          sudo apt-get install -y bat
          sudo ln -sf /usr/bin/batcat /usr/local/bin/bat
          bat --version

      - name: The gate (nu test.nu --ci)
        run: nu test.nu --ci
